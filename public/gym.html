<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Management Ecosystem | Vertex Systems</title>
    <link rel="stylesheet" href="styles.css?v=20261009-mobile-scroll2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=JetBrains+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap"
        rel="stylesheet">
    <style>
        body {
            background: #000;
            color: var(--text-white);
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* Global Glows */
        .page-glow {
            position: fixed;
            width: 100vw;
            height: 100vh;
            top: 0;
            left: 0;
            z-index: -1;
            pointer-events: none;
            background: radial-gradient(circle at 50% 0%, #0a0a0a 0%, #000 100%);
        }

        .floating-orb {
            position: fixed;
            width: min(460px, 90vw);
            height: min(460px, 90vw);
            background: var(--accent-yellow);
            filter: blur(82px);
            opacity: 0.075;
            border-radius: 50%;
            z-index: -1;
            animation: drift 46s infinite alternate ease-in-out;
        }

        @keyframes drift {
            0% {
                transform: translate(-10%, -10%) scale(1);
            }

            100% {
                transform: translate(20%, 20%) scale(1.2);
            }
        }

        /* Navigation */
        .back-link {
            position: fixed;
            top: 24px;
            left: 24px;
            z-index: 100;
            padding: 10px 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border-dark);
            border-radius: 100px;
            color: var(--text-white);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: var(--transition-fast);
        }

        .back-link:hover {
            background: var(--accent-yellow);
            color: black;
            border-color: var(--accent-yellow);
            transform: translateX(5px);
        }

        /* Main Layout */
        .gym-experience {
            max-width: var(--container-max);
            margin: 0 auto;
            padding: 140px 24px 80px;
        }

        .header-section {
            text-align: center;
            margin-bottom: 80px;
            animation: fadeInUp 1s cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .header-section h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(32px, 6vw, 64px);
            margin-bottom: 20px;
            line-height: 1.1;
        }

        .header-section p {
            color: var(--text-slate);
            font-size: 18px;
            max-width: 700px;
            margin: 0 auto;
        }

        /* Warp Showcase */
        .warp-showcase {
            display: grid;
            grid-template-columns: 400px 1fr;
            gap: 60px;
            align-items: center;
        }

        .feature-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .feature-tab {
            appearance: none;
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 20px;
            cursor: pointer;
            transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
            text-align: left;
            color: var(--text-white);
            font: inherit;
            position: relative;
            overflow: hidden;
        }

        .feature-tab::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at var(--mouse-x, 50%) var(--mouse-y, 50%), rgba(234, 179, 8, 0.1), transparent 50%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .feature-tab:hover::before {
            opacity: 1;
        }

        .feature-tab:hover {
            border-color: var(--accent-yellow);
            background: rgba(234, 179, 8, 0.02);
        }

        .feature-tab.active {
            border-color: var(--accent-yellow);
            background: rgba(234, 179, 8, 0.05);
            box-shadow: 0 0 16px rgba(234, 179, 8, 0.07);
        }

        .feature-tab:focus-visible {
            outline: 2px solid var(--accent-yellow);
            outline-offset: 3px;
        }

        .feature-tab h2 {
            font-family: 'Playfair Display', serif;
            font-size: 22px;
            margin-bottom: 8px;
            transition: color 180ms ease;
        }

        .feature-tab.active h2 {
            color: var(--accent-yellow);
        }

        .feature-tab p {
            font-size: 15px;
            color: var(--text-slate);
            margin: 0;
        }

        /* 3D Visual Stage */
        .visual-stage {
            position: relative;
            height: 600px;
            perspective: 2000px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage-container {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
        }

        .stage-image {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 80%;
            height: 80%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-dark);
            box-shadow: 0 28px 60px rgba(0, 0, 0, 0.65);
            opacity: 0;
            transition: opacity 280ms ease, transform 320ms cubic-bezier(0.2, 0.7, 0.2, 1);
            pointer-events: none;
            z-index: 1;
        }

        .stage-image.active {
            opacity: 1;
            z-index: 10;
            transform: translate(-50%, -50%) rotateY(0deg) rotateX(0deg) translateZ(0px) scale(1);
        }

        .stage-image.prev {
            opacity: 0;
            transform: translate(-53%, -50%) rotateY(-5deg) translateZ(-24px) scale(0.98);
        }

        .stage-image.next {
            opacity: 0;
            transform: translate(-47%, -50%) rotateY(5deg) translateZ(-24px) scale(0.98);
        }

        @media (max-width: 1024px) {
            .warp-showcase {
                grid-template-columns: 1fr;
            }

            .visual-stage {
                order: -1;
                height: 400px;
            }
        }

        @media (max-width: 600px) {
            .gym-experience {
                padding: 100px 20px 40px;
            }

            .header-section {
                text-align: left;
            }

            .header-section h1 {
                font-size: 36px;
            }

            .feature-list {
                gap: 12px;
            }

            .feature-tab {
                padding: 16px;
            }
        }
    </style>
</head>

<body>
    <div class="page-glow"></div>
    <div class="floating-orb" style="top: 10%; left: 20%;"></div>
    <div class="floating-orb" style="bottom: 10%; right: 10%; animation-delay: -10s;"></div>

    <a href="index.html" class="back-link">← Return to Ecosystem</a>

    <main class="gym-experience">
        <header class="header-section">
            <h1>Gym Management Ecosystem</h1>
            <p>Engineered for high-growth fitness centers. We replace operational chaos with mathematical precision,
                allowing you to scale your facility without increasing your workload.</p>
        </header>

        <section class="warp-showcase">
            <div class="feature-list">
                <button type="button" class="feature-tab active" data-image="GYMphotos/Members Management.png"
                    aria-pressed="true">
                    <h2>Member Lifecycle</h2>
                    <p>Complete profile management with automated renewal tracking and biometric attendance.</p>
                </button>
                <button type="button" class="feature-tab" data-image="GYMphotos/Checking in.png" aria-pressed="false">
                    <h2>Rapid Access</h2>
                    <p>Frictionless check-in systems that eliminate queues and enhance member experience.</p>
                </button>
                <button type="button" class="feature-tab" data-image="GYMphotos/Payment Management.png"
                    aria-pressed="false">
                    <h2>Financial Engine</h2>
                    <p>Multi-gateway automated billing with real-time revenue leakage detection.</p>
                </button>
                <button type="button" class="feature-tab" data-image="GYMphotos/Reports And Analytics.png"
                    aria-pressed="false">
                    <h2>Strategic Intelligence</h2>
                    <p>Deep-dive analytics into retention rates and peak-hour utilization.</p>
                </button>
                <button type="button" class="feature-tab" data-image="GYMphotos/ID card page.png" aria-pressed="false">
                    <h2>Brand Identity</h2>
                    <p>Professional ID generation and secure digital membership credentials.</p>
                </button>
            </div>

            <div class="visual-stage">
                <div class="stage-container" id="stage">
                    <!-- Images injected by JS -->
                </div>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.feature-tab');
            const stage = document.getElementById('stage');

            // Initialize images
            tabs.forEach((tab, index) => {
                const img = document.createElement('img');
                img.src = tab.dataset.image;
                img.className = 'stage-image' + (index === 0 ? ' active' : '');
                img.dataset.index = index;
                stage.appendChild(img);
            });

            const images = document.querySelectorAll('.stage-image');

            tabs.forEach((tab, index) => {
                const activate = () => {
                    tabs.forEach((item, itemIndex) => {
                        const isActive = itemIndex === index;
                        item.classList.toggle('active', isActive);
                        item.setAttribute('aria-pressed', String(isActive));
                    });
                    images.forEach((img, i) => {
                        img.classList.remove('active', 'prev', 'next');
                        if (i === index) {
                            img.classList.add('active');
                        } else if (i < index) {
                            img.classList.add('prev');
                        } else {
                            img.classList.add('next');
                        }
                    });
                };

                tab.addEventListener('click', activate);
                tab.addEventListener('mouseenter', () => {
                    if (window.matchMedia('(hover: hover) and (pointer: fine)').matches) activate();
                });
            });

            // Mouse-follow glow for tabs
            document.addEventListener('mousemove', (e) => {
                tabs.forEach(tab => {
                    const rect = tab.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    tab.style.setProperty('--mouse-x', x + '%');
                    tab.style.setProperty('--mouse-y', y + '%');
                });
            });
        });
    </script>
</body>

</html>
